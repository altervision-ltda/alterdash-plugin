name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate marketplace and plugins
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

      - name: Only allowed file types
        run: |
          bad=$(git ls-files | grep -viE '\.(md|txt|json|ya?ml|png|jpe?g|gif|webp|ico)$' \
            | grep -vxE 'LICENSE|\.gitignore' || true)
          if [ -n "$bad" ]; then echo "Not allowed by the plugin directory:"; echo "$bad"; exit 1; fi
